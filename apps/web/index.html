<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streets — カラムで組み立てる Nostr クライアント</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://streets.eyemono.moe/" />
    <meta
      name="description"
      content="Streets はブラウザで使える Nostr クライアントです。タイムライン・通知・検索・ハッシュタグ・リストなどのカラムを並べて、自分だけの画面を組み立てられます。秘密鍵は預からず、拡張機能やリモート署名器でログインします。"
    />
    <meta property="og:site_name" content="Streets" />
    <meta
      property="og:title"
      content="Streets — カラムで組み立てる Nostr クライアント"
    />
    <meta
      property="og:description"
      content="タイムライン・通知・検索などのカラムを並べて、自分だけの画面を組み立てる Nostr クライアント。"
    />
    <meta property="og:image" content="https://streets.eyemono.moe/ogp.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://streets.eyemono.moe/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Streets",
        "url": "https://streets.eyemono.moe/",
        "description": "カラムを並べて自分だけの画面を組み立てる、ブラウザで使える Nostr クライアント。",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "ja",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/eyemono-moe/streets",
        "image": "https://streets.eyemono.moe/ogp.webp"
      }
    </script>
    <style>
      /* JS より先に色を決めるため、src/theme.ts の PALETTES.purple をここにも書く */
      :root {
        --theme-accent-color: #8440bd;
        --theme-ui-color: #302170;
      }
    </style>
  </head>

  <body class="bg-primary c-primary font-sans scrollbar-color-theme">
    <div id="root">
      <!--
        JS が描くまでの間と、JS を動かさない読み手に見せる紹介。描画の前に消す（src/index.tsx）。
        ビルドした CSS は head で読まれるので、アプリと同じクラスで形を決められる。
      -->
      <main
        class="mx-auto flex max-w-xl flex-col gap-3 px-4 pt-[15vh] pb-8 text-body leading-relaxed"
      >
        <h1 class="flex items-center gap-3 font-700 text-h3">
          <img src="/favicon.svg" alt="" class="size-10" />Streets
        </h1>
        <p>
          Streets はブラウザで使える Nostr
          のクライアントです。タイムライン、通知、検索結果、ハッシュタグ、リストなどのカラムを並べて、自分だけの画面を組み立てられます。
        </p>
        <ul class="list-disc pl-6">
          <li>カラムは好きな数だけ足し、並べ替え、幅を変えられます</li>
          <li>投稿やユーザーを開くと、カラムの上に重ねて表示します</li>
          <li>
            秘密鍵は預からず、ブラウザの拡張機能やリモート署名器でログインします
          </li>
        </ul>
        <noscript
          ><p>Streets を使うには JavaScript を有効にしてください。</p></noscript
        >
      </main>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
