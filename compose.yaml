version: "3.8"

services:
  nostr-rs-relay:
    image: scsibug/nostr-rs-relay:latest
    sysctls:
      net.core.somaxconn: 8128
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./.local-dev/nostr-rs-relay-config.toml
        target: /usr/src/app/config.toml
      - ./data/nostr-rs-relay/db:/usr/src/app/db
    ports:
      - "8080:8080"
    networks:
      - relay
    depends_on:
      - postgres
  nostr-rs-relay-2:
    image: scsibug/nostr-rs-relay:latest
    sysctls:
      net.core.somaxconn: 8128
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./.local-dev/nostr-rs-relay-2-config.toml
        target: /usr/src/app/config.toml
      - ./data/nostr-rs-relay-2/db:/usr/src/app/db
    ports:
      - "8081:8080"
    networks:
      - relay
  postgres:
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nostr
    ports:
      - 5432:5432
    networks:
      - relay
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  # 画像のアップロード先（Blossom / NIP-B7）。投稿に画像を添える動きをローカルで試す。
  blossom:
    image: ghcr.io/hzrd149/blossom-server:master
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./.local-dev/blossom-config.yml
        target: /app/config.yml
      - ./data/blossom:/app/data
    ports:
      - "8090:3000"
networks:
  relay:
volumes:
  postgres:
