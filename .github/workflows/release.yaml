# タグ（v1.2.3）を打つとリリースする。
#   1. 版をプレビューに上げる（本番には出さない）。URL はジョブの要約に出る
#   2. 本番のジョブが承認待ちで止まる（production 環境の必須レビュアー）
#   3. 承認したら、プレビューで確かめたのと同じ版を本番に出し、GitHub の Release を作る
#   4. Nostr にリリースを知らせる（日本のリレーへは東京の Worker を経由する）
# 本文は apps/web/src/releases/<タグ>.md。無ければ止まる。手順は docs/release.md。
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-24.04
    environment: preview
    outputs:
      version-id: ${{ steps.upload.outputs.version-id }}
      preview-url: ${{ steps.upload.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main に入ったコミットか確かめる
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::タグ ${GITHUB_REF_NAME} は main に入っていないコミットを指しています"
            exit 1
          fi
      - name: リリースノートがあるか確かめる
        run: |
          notes="apps/web/src/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::${notes} がありません。リリースの準備の PR をマージしてからタグを打ってください"
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: ビルド
        run: vp run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENV: production
          # フィードバックの Google フォーム。公開してよい値なので secrets ではなく vars に置く。
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
      - name: 版を上げる（本番には出さない）
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          vp exec wrangler versions upload \
            --tag "$GITHUB_REF_NAME" \
            --message "$GITHUB_REF_NAME ($GITHUB_SHA)"
          result=$(jq -cs 'map(select(.type == "version-upload")) | last' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version-id=$(jq -r .version_id <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "preview-url=$(jq -r .preview_url <<<"$result")" >> "$GITHUB_OUTPUT"
      - name: 要約にプレビューの URL を出す
        run: |
          {
            echo "## ${GITHUB_REF_NAME} のプレビュー"
            echo
            echo "${{ steps.upload.outputs.preview-url }}"
            echo
            echo "確かめたら、Production のジョブを承認すると本番に出ます。"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production
    needs: preview
    runs-on: ubuntu-24.04
    # 必須レビュアーの承認を待つ。承認したらプレビューと同じ版を出す（ビルドし直さない）。
    environment:
      name: production
      url: https://streets.eyemono.moe
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 本番に出す
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          vp exec wrangler versions deploy \
            "${{ needs.preview.outputs.version-id }}@100%" \
            --message "$GITHUB_REF_NAME" --yes
      - name: GitHub の Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        # 本文はアプリと同じノート。先頭の日付（--- で囲んだ部分）は GitHub では崩れるので外し、
        # 人の参照（nostr:npub1…）は GitHub では押せないので njump.me へのリンクにする。
        # その後ろに、GitHub が作る PR の一覧と前の版からの比較を足す（--generate-notes）。
        run: |
          awk 'NR == 1 && /^---$/ { front = 1; next }
               front && /^---$/ { front = 0; next }
               !front' "apps/web/src/releases/${GITHUB_REF_NAME}.md" |
            sed -E 's#nostr:((npub|nprofile)1[02-9ac-hj-np-z]+)#[\1](https://njump.me/\1)#g' \
            > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
      - name: Nostr に知らせる本文を作る
        id: nostr-content
        # 本文にもノートを入れる。Nostr のクライアントの多くは Markdown を描かないので、
        # 見出しは【】に、リンクは「文字 (URL)」にする。人の参照（nostr:…）はそのまま押せる。
        run: |
          {
            echo "content<<NOSTR_CONTENT"
            echo "Streets ${GITHUB_REF_NAME} がリリースされました🎉"
            echo "https://streets.eyemono.moe"
            echo
            awk 'NR == 1 && /^---$/ { front = 1; next }
                 front && /^---$/ { front = 0; next }
                 !front' "apps/web/src/releases/${GITHUB_REF_NAME}.md" |
              sed -E -e 's/^#+ +(.*)$/【\1】/' \
                -e 's#\[([^]]+)\]\((https?://[^)]+)\)#\1 (\2)#g' |
              # 空行は 1 つに詰め、頭と末尾と見出しの直後の空行は落とす。
              awk 'NF { if (started && blank && !heading) print ""
                        print; started = 1; blank = 0; heading = /^【/; next }
                   { blank = 1 }'
            echo
            echo "リリースノート: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            echo "#Streets"
            echo "NOSTR_CONTENT"
          } >> "$GITHUB_OUTPUT"
      - name: Nostr に知らせる
        id: nostr
        uses: snow-actions/nostr@v2.0.0
        with:
          relays: ${{ vars.NOSTR_RELAYS }}
          private-key: ${{ secrets.NOSTR_PRIVATE_KEY }}
          content: ${{ steps.nostr-content.outputs.content }}
          tags: |
            - ["t", "streets"]
      - name: 日本のリレーへ東京から届ける
        # 日本のリレーには、日本の外（Actions はアメリカ）からの書き込みを断るものがあるので、
        # 東京で動かす Worker（workers/relay-proxy）に署名済みのイベントを渡して流してもらう。
        # 届かなかったリレーは警告に出すだけにする（本番にはもう出ている）。
        env:
          EVENT: ${{ steps.nostr.outputs.event }}
          RELAYS: ${{ vars.NOSTR_PROXY_RELAYS }}
          PROXY_URL: ${{ vars.NOSTR_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.NOSTR_PROXY_TOKEN }}
        run: |
          jq -n --argjson event "$EVENT" --arg relays "$RELAYS" \
            '{ event: $event, relays: ($relays | split("\n") | map(gsub("\\s"; "")) | map(select(length > 0))) }' \
            > "$RUNNER_TEMP/proxy.json"
          curl -sS --fail-with-body --max-time 30 -X POST \
            -H "authorization: Bearer $PROXY_TOKEN" \
            -H "content-type: application/json" \
            --data @"$RUNNER_TEMP/proxy.json" \
            "$PROXY_URL" > "$RUNNER_TEMP/proxy-result.json"
          jq -r '.results[] | "\(if .accepted then "届いた" else "届かない" end) \(.relay) \(.message)"' \
            "$RUNNER_TEMP/proxy-result.json"
          jq -r '.results[] | select(.accepted | not) | "::warning::\(.relay) に届かなかった: \(.message)"' \
            "$RUNNER_TEMP/proxy-result.json"
