packages:
  - "packages/*"
  - "apps/*"
  - "workers/*"
  - "tools/*"
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
